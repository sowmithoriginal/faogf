    requirement_level:
      conditionally_required: for re-delegated authority
    stability: development
  - name: fin.audit.evidence.ids
    type: string[]
    brief: Evidence produced by a tool call, or evidence present in a model call's context.
    examples:
    - - ev_3f2a
    requirement_level:
      conditionally_required: when the tool returns evidence
