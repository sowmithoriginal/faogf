- id: span.fin.audit.execute_tool
  type: span
  brief: Tool execution by an agent through the FAOGF gateway (extends gen_ai execute_tool spans).
  stability: development
  attributes:
  - name: fin.audit.action
    type: string
    brief: Normalised action verb.
    examples:
    - read
    - search
    - compute
    - share
    - delegate
    - generate
    - decide
    requirement_level: required
    stability: development
  - name: fin.audit.binding
    type: string
