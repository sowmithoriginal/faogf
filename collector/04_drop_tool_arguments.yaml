# FAOGF experiment Collector configuration: drop_tool_arguments
# Used for: Table XI delete tool arguments (E15)
# Collector: otelcol-contrib v0.163.2
# Generated from experiments/otel_pipeline.py (PROCESSORS['drop_tool_arguments']).
# At run time the harness binds the OTLP/HTTP receiver to a free local port and writes
# spans to a temporary directory; endpoint and path below are the only substituted values.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318
processors:
  attributes/drop_args:
    actions:
    - key: gen_ai.tool.call.arguments
      action: delete
  batch: {}
exporters:
  file:
    path: ./collector-out/spans.json
service:
  telemetry:
    metrics:
      level: none
    logs:
      level: warn
  pipelines:
    traces:
      receivers:
      - otlp
      processors:
      - attributes/drop_args
      - batch
      exporters:
      - file
