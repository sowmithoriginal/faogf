# FAOGF experiment Collector configuration: redaction_allowlist
# Used for: Table XI redaction allow-list (E15)
# Collector: otelcol-contrib v0.163.2
# Generated from experiments/otel_pipeline.py (PROCESSORS['redaction_allowlist']).
# At run time the harness binds the OTLP/HTTP receiver to a free local port and writes
# spans to a temporary directory; endpoint and path below are the only substituted values.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318
processors:
  redaction:
    allow_all_keys: false
    summary: silent
    allowed_keys:
    - gen_ai.operation.name
    - gen_ai.tool.name
    - gen_ai.tool.call.id
    - gen_ai.tool.call.arguments
    - gen_ai.agent.id
    - gen_ai.request.model
  batch: {}
exporters:
  file:
    path: ./collector-out/spans.json
service:
  telemetry:
    metrics:
      level: none
    logs:
      level: warn
  pipelines:
    traces:
      receivers:
      - otlp
      processors:
      - redaction
      - batch
      exporters:
      - file
